# 프론트엔드 공통 셋업: Node(frontend/.nvmrc) + npm 캐시(frontend/package-lock.json 기준) + npm ci
# 사용: - uses: ./.github/actions/setup-frontend   (checkout 이후에만 가능)
name: Setup Frontend
description: Set up Node.js with npm cache and install frontend dependencies

inputs:
  node-version:
    description: Node.js version override. Empty (default) reads frontend/.nvmrc.
    required: false
    default: ''
  install:
    description: Run `npm ci` in frontend ("true"/"false")
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: frontend/.nvmrc
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: frontend
      run: npm ci
