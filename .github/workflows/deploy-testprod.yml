# Deploy Testprod (Backend + Frontend)
name: Deploy Testprod

on:
  push:
    branches: [testprod]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  EB_APPLICATION_NAME: kanban-dev
  EB_ENVIRONMENT_NAME: kanban-dev-env
  S3_BUCKET: kanban-testprod-frontend
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  # Detect which paths changed to skip unnecessary deploys
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

      - name: Log detected changes
        run: |
          echo "Backend changed: ${{ steps.filter.outputs.backend }}"
          echo "Frontend changed: ${{ steps.filter.outputs.frontend }}"

  # Deploy Backend to Elastic Beanstalk
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: backend
        run: chmod +x gradlew

      - name: Build JAR
        working-directory: backend
        run: ./gradlew bootJar --no-daemon -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate deployment package
        run: |
          cd backend
          mkdir -p deploy
          cp build/libs/*.jar deploy/application.jar
          cp Procfile deploy/ 2>/dev/null || true
          cp -r .ebextensions deploy/ 2>/dev/null || true
          cd deploy && zip -r ../deploy.zip .

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ env.EB_APPLICATION_NAME }}
          environment_name: ${{ env.EB_ENVIRONMENT_NAME }}
          version_label: testprod-${{ github.sha }}
          region: ${{ env.AWS_REGION }}
          deployment_package: backend/deploy.zip
          wait_for_deployment: true
          wait_for_environment_recovery: 120
          use_existing_version_if_available: true

  # Deploy Frontend to S3
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.DEV_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_SENTRY_ENVIRONMENT: testprod

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/dist s3://${{ env.S3_BUCKET }} \
            --delete \
            --cache-control "max-age=31536000,public" \
            --exclude "index.html"

          aws s3 cp frontend/dist/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        if: vars.TESTPROD_CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.TESTPROD_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-backend, deploy-frontend]
    if: always() && !cancelled()

    steps:
      - name: Deployment Status
        run: |
          BE_RESULT="${{ needs.deploy-backend.result }}"
          FE_RESULT="${{ needs.deploy-frontend.result }}"

          echo "Backend: ${BE_RESULT}"
          echo "Frontend: ${FE_RESULT}"

          # failure in any deploy job = overall failure
          if [ "$BE_RESULT" == "failure" ] || [ "$FE_RESULT" == "failure" ]; then
            echo "❌ Testprod deployment failed!"
            exit 1
          fi

          echo "✅ Testprod deployment completed!"
          [ "$BE_RESULT" == "skipped" ] && echo "  Backend: skipped (no changes)"
          [ "$BE_RESULT" == "success" ] && echo "  Backend: deployed"
          [ "$FE_RESULT" == "skipped" ] && echo "  Frontend: skipped (no changes)"
          [ "$FE_RESULT" == "success" ] && echo "  Frontend: deployed"
