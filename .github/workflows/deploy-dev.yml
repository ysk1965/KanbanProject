# Deploy to All Environments (Dev + Testprod)
# Dev = bridgespots.com, Testprod = milkyway.pe.kr
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [develop]
    types: [completed]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  EB_APPLICATION_NAME: kanban-dev
  EB_ENVIRONMENT_NAME: kanban-dev-env
  S3_BUCKET_DEV: kanban-dev-frontend-259151461692
  # NOTE: testprod/milkyway frontend bucket not yet migrated to the new account (259151461692).
  # The testprod deploy steps below will fail until this bucket is created or milkyway is repointed.
  S3_BUCKET_TESTPROD: kanban-testprod-frontend
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  # Detect which paths changed to skip unnecessary deploys
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 2

      - name: Check changed paths
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger: deploying all"
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "Changed files:"
          echo "$CHANGED"

          if [ -z "$CHANGED" ]; then
            echo "No changes detected, deploying all as fallback"
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=$(echo "$CHANGED" | grep -q '^backend/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
            echo "frontend=$(echo "$CHANGED" | grep -q '^frontend/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          fi

  # Deploy Backend to Elastic Beanstalk
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: backend
        run: chmod +x gradlew

      - name: Build JAR
        working-directory: backend
        run: ./gradlew bootJar --no-daemon -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure infrastructure is running
        run: |
          # Check if EB ASG is scaled to 0 (off-peak shutdown mode)
          ASG_NAME=$(aws elasticbeanstalk describe-environment-resources \
            --environment-name ${{ env.EB_ENVIRONMENT_NAME }} \
            --query 'EnvironmentResources.AutoScalingGroups[0].Name' \
            --output text 2>/dev/null || echo "")

          if [ -z "$ASG_NAME" ] || [ "$ASG_NAME" == "None" ]; then
            echo "Could not find ASG, skipping wake-up check"
            exit 0
          fi

          DESIRED=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].DesiredCapacity' \
            --output text)

          if [ "$DESIRED" -eq "0" ]; then
            echo "Infrastructure is in shutdown mode. Waking up for deployment..."

            # Start RDS first (takes longer to boot)
            aws rds start-db-instance \
              --db-instance-identifier kanban-dev-db 2>/dev/null || true

            # Scale up EB ASG
            aws autoscaling update-auto-scaling-group \
              --auto-scaling-group-name "$ASG_NAME" \
              --min-size 1 --max-size 2 --desired-capacity 1

            echo "Waiting for RDS and EB to become available (~3 min)..."
            sleep 180
          else
            echo "Infrastructure is running (desired=$DESIRED). Proceeding with deploy."
          fi

      - name: Generate deployment package
        run: |
          cd backend
          mkdir -p deploy
          cp build/libs/*.jar deploy/application.jar
          cp Procfile deploy/ 2>/dev/null || true
          cp -r .ebextensions deploy/ 2>/dev/null || true
          cp -r .platform deploy/ 2>/dev/null || true
          cd deploy && zip -r ../deploy.zip .

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          application_name: ${{ env.EB_APPLICATION_NAME }}
          environment_name: ${{ env.EB_ENVIRONMENT_NAME }}
          version_label: ${{ github.sha }}
          region: ${{ env.AWS_REGION }}
          deployment_package: backend/deploy.zip
          wait_for_deployment: true
          wait_for_environment_recovery: 120
          use_existing_version_if_available: true

  # Deploy Frontend to S3 (Dev + Testprod)
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.DEV_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_CLOUDFRONT_DOMAIN: ${{ vars.DEV_CLOUDFRONT_ATTACHMENTS_DOMAIN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3 (Dev - bridgespots.com)
        run: |
          # 해시된 에셋: --delete 없이 업로드 (구버전 chunk 유지로 기존 세션 보호)
          aws s3 sync frontend/dist/assets s3://${{ env.S3_BUCKET_DEV }}/assets \
            --cache-control "max-age=31536000,public"

          # 나머지 (HTML, SW, manifest 등) no-cache
          aws s3 sync frontend/dist s3://${{ env.S3_BUCKET_DEV }} \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Deploy to S3 (Testprod - milkyway.pe.kr)
        run: |
          # 해시된 에셋: --delete 없이 업로드 (구버전 chunk 유지로 기존 세션 보호)
          aws s3 sync frontend/dist/assets s3://${{ env.S3_BUCKET_TESTPROD }}/assets \
            --cache-control "max-age=31536000,public"

          # 나머지 (HTML, SW, manifest 등) no-cache
          aws s3 sync frontend/dist s3://${{ env.S3_BUCKET_TESTPROD }} \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront (Dev - bridgespots.com)
        if: vars.DEV_CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.DEV_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Invalidate CloudFront (Testprod - milkyway.pe.kr)
        if: vars.TESTPROD_CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.TESTPROD_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  # Notify deployment status
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-backend, deploy-frontend]
    if: always() && !cancelled()

    steps:
      - name: Deployment Status
        id: status
        run: |
          BE_RESULT="${{ needs.deploy-backend.result }}"
          FE_RESULT="${{ needs.deploy-frontend.result }}"

          echo "Backend: ${BE_RESULT}"
          echo "Frontend: ${FE_RESULT}"

          if [ "$BE_RESULT" == "failure" ] || [ "$FE_RESULT" == "failure" ]; then
            echo "deploy_failed=true" >> $GITHUB_OUTPUT
            echo "❌ Deployment failed!"
          else
            echo "deploy_failed=false" >> $GITHUB_OUTPUT
            echo "✅ Deployment completed!"
          fi

          # Build summary for notification
          BE_MSG="skipped"
          [ "$BE_RESULT" == "success" ] && BE_MSG="✅ deployed to EB"
          [ "$BE_RESULT" == "failure" ] && BE_MSG="❌ failed"
          FE_MSG="skipped"
          [ "$FE_RESULT" == "success" ] && FE_MSG="✅ deployed"
          [ "$FE_RESULT" == "failure" ] && FE_MSG="❌ failed"

          echo "be_msg=${BE_MSG}" >> $GITHUB_OUTPUT
          echo "fe_msg=${FE_MSG}" >> $GITHUB_OUTPUT

      - name: Send Discord Notification
        if: vars.DEPLOY_DISCORD_WEBHOOK_URL != ''
        run: |
          if [ "${{ steps.status.outputs.deploy_failed }}" == "true" ]; then
            COLOR=15548997  # Red
            TITLE="❌ Deploy Failed"
          else
            COLOR=5763719   # Green
            TITLE="✅ Deploy Succeeded"
          fi

          COMMIT_MSG=$(echo '${{ github.event.workflow_run.head_commit.message || github.event.head_commit.message }}' | head -1 | sed 's/"/\\"/g' | cut -c1-100)
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"${TITLE}\",
                \"color\": ${COLOR},
                \"fields\": [
                  {\"name\": \"Backend\", \"value\": \"${{ steps.status.outputs.be_msg }}\", \"inline\": true},
                  {\"name\": \"Frontend\", \"value\": \"${{ steps.status.outputs.fe_msg }}\", \"inline\": true},
                  {\"name\": \"Commit\", \"value\": \"[\`${SHORT_SHA}\`](https://github.com/${{ github.repository }}/commit/${SHA}) ${COMMIT_MSG}\"}
                ],
                \"footer\": {\"text\": \"BRIDGE Deploy\"},
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
                \"url\": \"${RUN_URL}\"
              }]
            }" \
            "${{ vars.DEPLOY_DISCORD_WEBHOOK_URL }}"

      - name: Fail if deployment failed
        if: steps.status.outputs.deploy_failed == 'true'
        run: exit 1
