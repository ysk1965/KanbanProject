# Deploy Frontend + Backend (single new-account stack)
# Frontend bucket + CloudFront serve BOTH bridgespots.com and milkyway.pe.kr
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [develop]
    types: [completed]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  EB_APPLICATION_NAME: kanban-dev
  EB_ENVIRONMENT_NAME: kanban-dev-env
  S3_BUCKET_DEV: kanban-dev-frontend-259151461692
  # milkyway.pe.kr is served from the SAME bucket + CloudFront as bridgespots.com
  # (single distribution, Host-based spa_router). No separate testprod bucket/CF.
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  # Detect which paths changed to skip unnecessary deploys
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 2

      - name: Check changed paths
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger: deploying all"
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "Changed files:"
          echo "$CHANGED"

          if [ -z "$CHANGED" ]; then
            echo "No changes detected, deploying all as fallback"
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=$(echo "$CHANGED" | grep -q '^backend/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
            echo "frontend=$(echo "$CHANGED" | grep -q '^frontend/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          fi

  # Deploy Backend to Elastic Beanstalk
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: backend
        run: chmod +x gradlew

      - name: Build JAR
        working-directory: backend
        run: ./gradlew bootJar --no-daemon -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure infrastructure is running
        run: |
          # Check if EB ASG is scaled to 0 (off-peak shutdown mode)
          ASG_NAME=$(aws elasticbeanstalk describe-environment-resources \
            --environment-name ${{ env.EB_ENVIRONMENT_NAME }} \
            --query 'EnvironmentResources.AutoScalingGroups[0].Name' \
            --output text 2>/dev/null || echo "")

          if [ -z "$ASG_NAME" ] || [ "$ASG_NAME" == "None" ]; then
            echo "Could not find ASG, skipping wake-up check"
            exit 0
          fi

          DESIRED=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].DesiredCapacity' \
            --output text)

          if [ "$DESIRED" -eq "0" ]; then
            echo "Infrastructure is in shutdown mode. Waking up for deployment..."

            # Start RDS first (takes longer to boot)
            aws rds start-db-instance \
              --db-instance-identifier kanban-dev-db 2>/dev/null || true

            # Scale up EB ASG
            aws autoscaling update-auto-scaling-group \
              --auto-scaling-group-name "$ASG_NAME" \
              --min-size 1 --max-size 2 --desired-capacity 1

            # A blind sleep raced the wake-up: beanstalk-deploy could start an
            # environment update before the freshly-launched instance/platform
            # was ready, intermittently failing the bundle pull with a transient
            # "s3:GetObjectAcl" error and leaving the env on the old version.
            # Poll the real readiness signals instead.
            echo "Waiting for RDS to become available..."
            aws rds wait db-instance-available \
              --db-instance-identifier kanban-dev-db || true

            echo "Waiting for an EB instance to reach InService and the env to be Ready..."
            READY=0
            for i in $(seq 1 40); do
              IN_SERVICE=$(aws autoscaling describe-auto-scaling-groups \
                --auto-scaling-group-names "$ASG_NAME" \
                --query "length(AutoScalingGroups[0].Instances[?LifecycleState=='InService'])" \
                --output text 2>/dev/null || echo "0")
              STATUS=$(aws elasticbeanstalk describe-environments \
                --environment-names ${{ env.EB_ENVIRONMENT_NAME }} \
                --query 'Environments[0].Status' --output text 2>/dev/null || echo "")
              echo "  [$i] EB status=$STATUS, InService instances=$IN_SERVICE"
              if [ "$STATUS" == "Ready" ] && [ "$IN_SERVICE" -ge 1 ]; then
                READY=1
                break
              fi
              sleep 15
            done

            if [ "$READY" -ne 1 ]; then
              echo "::error::EB environment did not become ready in time after wake-up"
              exit 1
            fi

            # Brief settle so the EB platform/agent on the new instance is fully
            # initialized before the application-version deployment starts.
            echo "EB is ready. Settling for 30s before deploy..."
            sleep 30
          else
            echo "Infrastructure is running (desired=$DESIRED). Proceeding with deploy."
          fi

      - name: Generate deployment package
        run: |
          cd backend
          mkdir -p deploy
          cp build/libs/*.jar deploy/application.jar
          cp Procfile deploy/ 2>/dev/null || true
          cp -r .ebextensions deploy/ 2>/dev/null || true
          cp -r .platform deploy/ 2>/dev/null || true
          cd deploy && zip -r ../deploy.zip .

      - name: Deploy to Elastic Beanstalk
        # Native AWS CLI deploy instead of einaregilsson/beanstalk-deploy.
        #
        # EB intermittently fails the application-version deploy with a transient
        # "s3:GetObjectAcl" AccessDenied while pulling the bundle (most often right
        # after the bundle upload or when the instance was just woken/churned),
        # leaving the env stranded on the old version — the new API then 404s.
        # The action made this worse (its own client-side GetObjectAcl check) and
        # gave no retry. Here we: upload the bundle, register the version, then
        # retry update-environment until the env *actually* lands on our version,
        # with a settle delay before each wait (a bare `wait environment-updated`
        # can return immediately if Status hasn't flipped to Updating yet).
        run: |
          set -uo pipefail
          APP="${{ env.EB_APPLICATION_NAME }}"
          ENV_NAME="${{ env.EB_ENVIRONMENT_NAME }}"
          # NOT github.sha: on a workflow_run event that resolves to the default
          # branch head, which is constant across deploys — every run would reuse
          # one application version label and overwrite its bundle, leaving no
          # version history to roll back to. Read the sha we actually checked out.
          SHA=$(git rev-parse HEAD)
          echo "Version label: ${SHA}"
          BUCKET=$(aws elasticbeanstalk create-storage-location --query S3Bucket --output text) || exit 1
          KEY="${APP}/${SHA}.zip"

          echo "Uploading bundle to s3://${BUCKET}/${KEY}"
          aws s3 cp backend/deploy.zip "s3://${BUCKET}/${KEY}" || exit 1

          # Re-run safe: reuse the application version if it already exists.
          EXISTING=$(aws elasticbeanstalk describe-application-versions \
            --application-name "$APP" --version-labels "$SHA" \
            --query 'ApplicationVersions[0].VersionLabel' --output text 2>/dev/null || echo "None")
          if [ "$EXISTING" == "$SHA" ]; then
            echo "Application version $SHA already exists, reusing it."
          else
            echo "Creating application version $SHA"
            aws elasticbeanstalk create-application-version \
              --application-name "$APP" --version-label "$SHA" \
              --source-bundle S3Bucket="$BUCKET",S3Key="$KEY" \
              --no-process || exit 1
            # Brief settle for S3 read-after-write before EB pulls the object.
            sleep 10
          fi

          deploy_ok=0
          for attempt in 1 2 3 4; do
            echo "::group::Deploy attempt ${attempt}: update-environment -> ${SHA}"
            aws elasticbeanstalk update-environment \
              --environment-name "$ENV_NAME" --version-label "$SHA" >/dev/null \
              || { echo "update-environment call failed; retrying"; echo "::endgroup::"; sleep 30; continue; }

            # Let Status transition to Updating before waiting (avoids premature return).
            sleep 25
            aws elasticbeanstalk wait environment-updated --environment-names "$ENV_NAME" || true

            DEPLOYED=$(aws elasticbeanstalk describe-environments \
              --environment-names "$ENV_NAME" \
              --query 'Environments[0].VersionLabel' --output text)
            HEALTH=$(aws elasticbeanstalk describe-environments \
              --environment-names "$ENV_NAME" \
              --query 'Environments[0].Health' --output text)
            echo "After attempt ${attempt}: version=${DEPLOYED} health=${HEALTH}"
            echo "::endgroup::"

            if [ "$DEPLOYED" == "$SHA" ]; then deploy_ok=1; break; fi
            echo "Version did not land (likely transient EB S3 error). Retrying in 30s..."
            sleep 30
          done

          if [ "$deploy_ok" -ne 1 ]; then
            echo "::error::Deployment did not land on ${SHA} after retries"
            aws elasticbeanstalk describe-events --environment-name "$ENV_NAME" \
              --max-items 12 --query "Events[*].[EventDate,Severity,Message]" --output text || true
            exit 1
          fi

          # Wait out any transient post-deploy health dip before declaring success.
          # RollingWithAdditionalBatch는 배포 완료 직후 잉여 배치 인스턴스(구버전)가
          # 회수되는 2~3분간 "Incorrect application version" Red가 떴다가 Green으로
          # 돌아온다 — 3분(12회)만 기다리면 그 창에 걸려 성공 배포를 실패로 오탐하므로
          # 6분(24회)까지 기다린다.
          for i in $(seq 1 24); do
            HEALTH=$(aws elasticbeanstalk describe-environments \
              --environment-names "$ENV_NAME" \
              --query 'Environments[0].Health' --output text)
            echo "  post-deploy health check [$i]: ${HEALTH}"
            [ "$HEALTH" == "Green" ] && break
            sleep 15
          done
          echo "Deployed ${SHA} (final health: ${HEALTH})"
          if [ "$HEALTH" == "Red" ]; then
            echo "::error::Environment is Red after deploying ${SHA}"
            exit 1
          fi

  # Deploy Frontend to S3 (Dev + Testprod)
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.DEV_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_CLOUDFRONT_DOMAIN: ${{ vars.DEV_CLOUDFRONT_ATTACHMENTS_DOMAIN }}
          # Sentry 런타임: DSN 있어야 에러가 실제로 수집되고 Error ID가 발급됨
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: development
          # Sentry 소스맵 업로드: AUTH_TOKEN 존재 시에만 hidden 소스맵 생성+업로드+삭제 (vite.config.ts)
          # 릴리스는 vite.config의 commitHash로 자동 태깅되므로 VITE_SENTRY_RELEASE는 주입하지 않는다.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3 (bridgespots.com + milkyway.pe.kr)
        run: |
          # 해시된 에셋: --delete 없이 업로드 (구버전 chunk 유지로 기존 세션 보호)
          # --exclude "*.map": 소스맵은 Sentry에만 업로드하고 공개 S3에는 절대 노출하지 않는다
          # (플러그인 업로드가 실패해 dist에 .map이 남아도 안전).
          aws s3 sync frontend/dist/assets s3://${{ env.S3_BUCKET_DEV }}/assets \
            --exclude "*.map" \
            --cache-control "max-age=31536000,public"

          # 나머지 (HTML, SW, manifest 등) no-cache
          aws s3 sync frontend/dist s3://${{ env.S3_BUCKET_DEV }} \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront (bridgespots + milkyway — single distribution)
        if: vars.DEV_CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.DEV_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  # Notify deployment status
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-backend, deploy-frontend]
    if: always() && !cancelled()

    steps:
      - name: Deployment Status
        id: status
        run: |
          BE_RESULT="${{ needs.deploy-backend.result }}"
          FE_RESULT="${{ needs.deploy-frontend.result }}"

          echo "Backend: ${BE_RESULT}"
          echo "Frontend: ${FE_RESULT}"

          if [ "$BE_RESULT" == "failure" ] || [ "$FE_RESULT" == "failure" ]; then
            echo "deploy_failed=true" >> $GITHUB_OUTPUT
            echo "❌ Deployment failed!"
          else
            echo "deploy_failed=false" >> $GITHUB_OUTPUT
            echo "✅ Deployment completed!"
          fi

          # Build summary for notification
          BE_MSG="skipped"
          [ "$BE_RESULT" == "success" ] && BE_MSG="✅ deployed to EB"
          [ "$BE_RESULT" == "failure" ] && BE_MSG="❌ failed"
          FE_MSG="skipped"
          [ "$FE_RESULT" == "success" ] && FE_MSG="✅ deployed"
          [ "$FE_RESULT" == "failure" ] && FE_MSG="❌ failed"

          echo "be_msg=${BE_MSG}" >> $GITHUB_OUTPUT
          echo "fe_msg=${FE_MSG}" >> $GITHUB_OUTPUT

      - name: Send Discord Notification
        if: vars.DEPLOY_DISCORD_WEBHOOK_URL != ''
        run: |
          if [ "${{ steps.status.outputs.deploy_failed }}" == "true" ]; then
            COLOR=15548997  # Red
            TITLE="❌ Deploy Failed"
          else
            COLOR=5763719   # Green
            TITLE="✅ Deploy Succeeded"
          fi

          COMMIT_MSG=$(echo '${{ github.event.workflow_run.head_commit.message || github.event.head_commit.message }}' | head -1 | sed 's/"/\\"/g' | cut -c1-100)
          # This job has no checkout, so take the triggering commit from the event
          # (github.sha would be the default branch head, not what was deployed).
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"${TITLE}\",
                \"color\": ${COLOR},
                \"fields\": [
                  {\"name\": \"Backend\", \"value\": \"${{ steps.status.outputs.be_msg }}\", \"inline\": true},
                  {\"name\": \"Frontend\", \"value\": \"${{ steps.status.outputs.fe_msg }}\", \"inline\": true},
                  {\"name\": \"Commit\", \"value\": \"[\`${SHORT_SHA}\`](https://github.com/${{ github.repository }}/commit/${SHA}) ${COMMIT_MSG}\"}
                ],
                \"footer\": {\"text\": \"BRIDGE Deploy\"},
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
                \"url\": \"${RUN_URL}\"
              }]
            }" \
            "${{ vars.DEPLOY_DISCORD_WEBHOOK_URL }}"

      - name: Fail if deployment failed
        if: steps.status.outputs.deploy_failed == 'true'
        run: exit 1
