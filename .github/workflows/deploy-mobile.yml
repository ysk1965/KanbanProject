name: Mobile Build & Deploy

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - ios
          - android
          - both
      track:
        description: 'Release track'
        required: true
        type: choice
        options:
          - beta
          - production

permissions:
  contents: read

# 스토어 업로드가 겹치지 않도록 모바일 배포는 한 번에 하나만 (취소 없이 대기).
concurrency:
  group: deploy-mobile
  cancel-in-progress: false

jobs:
  build-web:
    name: Build Web Assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: ./.github/actions/setup-frontend

      # VITE_* 목록은 deploy-dev.yml 의 웹 빌드와 동일하게 유지한다 (값만 prod).
      - name: Build web assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.PROD_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_CLOUDFRONT_DOMAIN: ${{ vars.PROD_CLOUDFRONT_ATTACHMENTS_DOMAIN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production

      - name: Sync Capacitor
        run: npx cap sync
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: frontend/dist/
          retention-days: 1

  build-ios:
    name: Build iOS
    needs: build-web
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: ./.github/actions/setup-frontend

      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: frontend/dist/

      - name: Sync Capacitor iOS
        run: npx cap sync ios
        working-directory: frontend

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: frontend/ios

      - name: Install Fastlane
        run: bundle install
        working-directory: frontend/ios

      - name: Build & Upload to TestFlight
        if: ${{ inputs.track == 'beta' }}
        run: bundle exec fastlane beta
        working-directory: frontend/ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_AUTH }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.ASC_API_KEY }}

      - name: Build & Submit to App Store
        if: ${{ inputs.track == 'production' }}
        run: bundle exec fastlane release
        working-directory: frontend/ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_AUTH }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.ASC_API_KEY }}

  build-android:
    name: Build Android
    needs: build-web
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: ./.github/actions/setup-frontend

      # 백엔드(JDK 21)와 다르게 Android 는 JDK 17 을 쓴다:
      # frontend/android/build.gradle 의 AGP 8.2.1 + Gradle 8.2.1 (Capacitor 6) 은 JDK 17 이 기준이고,
      # JDK 21 은 Gradle 8.5 이상에서만 지원된다. setup-backend 컴포지트는 쓰지 않는다 (backend/gradlew 대상).
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: frontend/dist/

      - name: Sync Capacitor Android
        run: npx cap sync android
        working-directory: frontend

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > frontend/android/app/keystore.jks

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: frontend/android

      - name: Install Fastlane
        run: bundle install
        working-directory: frontend/android

      - name: Build & Upload to Play Store (Internal)
        if: ${{ inputs.track == 'beta' }}
        run: bundle exec fastlane beta
        working-directory: frontend/android
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build & Upload to Play Store (Production)
        if: ${{ inputs.track == 'production' }}
        run: bundle exec fastlane release
        working-directory: frontend/android
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
