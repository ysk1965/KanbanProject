# Terraform Infrastructure Management
name: Terraform

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

env:
  TF_VERSION: '1.9.8'
  AWS_REGION: ap-northeast-2

jobs:
  # Terraform Plan on PR
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        environment: [dev, prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GHA_TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: terraform init

      - name: Terraform Validate
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: terraform plan -no-color -input=false
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_claude_api_key: ${{ secrets.CLAUDE_API_KEY }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_openai_admin_key: ${{ secrets.OPENAI_ADMIN_KEY }}
          TF_VAR_mail_username: ${{ secrets.MAIL_USERNAME }}
          TF_VAR_mail_password: ${{ secrets.MAIL_PASSWORD }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_polar_api_key: ${{ secrets.POLAR_API_KEY }}
          TF_VAR_polar_webhook_secret: ${{ secrets.POLAR_WEBHOOK_SECRET }}
          TF_VAR_polar_org_id: ${{ secrets.POLAR_ORG_ID }}
          TF_VAR_polar_product_board_monthly: ${{ secrets.POLAR_PRODUCT_BOARD_MONTHLY }}
          TF_VAR_polar_product_board_yearly: ${{ secrets.POLAR_PRODUCT_BOARD_YEARLY }}
          TF_VAR_polar_product_org_monthly: ${{ secrets.POLAR_PRODUCT_ORG_MONTHLY }}
          TF_VAR_polar_product_org_yearly: ${{ secrets.POLAR_PRODUCT_ORG_YEARLY }}
          TF_VAR_polar_product_credit_100: ${{ secrets.POLAR_PRODUCT_CREDIT_100 }}
          TF_VAR_polar_product_credit_500: ${{ secrets.POLAR_PRODUCT_CREDIT_500 }}
          TF_VAR_polar_product_credit_1000: ${{ secrets.POLAR_PRODUCT_CREDIT_1000 }}
          TF_VAR_discord_client_id: ${{ secrets.DISCORD_CLIENT_ID }}
          TF_VAR_discord_client_secret: ${{ secrets.DISCORD_CLIENT_SECRET }}
          TF_VAR_discord_bot_token: ${{ secrets.DISCORD_BOT_TOKEN }}
          TF_VAR_jira_oauth_client_id: ${{ secrets.JIRA_OAUTH_CLIENT_ID }}
          TF_VAR_jira_oauth_client_secret: ${{ secrets.JIRA_OAUTH_CLIENT_SECRET }}
          TF_VAR_github_app_id: ${{ secrets.GH_APP_ID }}
          TF_VAR_github_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          TF_VAR_github_app_slug: ${{ secrets.GH_APP_SLUG }}
          TF_VAR_confluence_oauth_client_id: ${{ secrets.CONFLUENCE_OAUTH_CLIENT_ID }}
          TF_VAR_confluence_oauth_client_secret: ${{ secrets.CONFLUENCE_OAUTH_CLIENT_SECRET }}
          TF_VAR_slack_client_id: ${{ secrets.SLACK_CLIENT_ID }}
          TF_VAR_slack_client_secret: ${{ secrets.SLACK_CLIENT_SECRET }}
          TF_VAR_slack_signing_secret: ${{ secrets.SLACK_SIGNING_SECRET }}
          TF_VAR_slack_token_encryption_key: ${{ secrets.SLACK_TOKEN_ENCRYPTION_KEY }}
          TF_VAR_slack_redirect_uri: ${{ secrets.SLACK_REDIRECT_URI }}
          TF_VAR_slack_user_redirect_uri: ${{ secrets.SLACK_USER_REDIRECT_URI }}

  # Terraform Apply (Manual or on main branch)
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: ${{ (github.event.inputs.environment == 'prod' && 'production') || github.event.inputs.environment || 'dev' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GHA_TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/${{ github.event.inputs.environment || 'dev' }}
        run: terraform init

      - name: Terraform Apply
        working-directory: infrastructure/terraform/environments/${{ github.event.inputs.environment || 'dev' }}
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_claude_api_key: ${{ secrets.CLAUDE_API_KEY }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_openai_admin_key: ${{ secrets.OPENAI_ADMIN_KEY }}
          TF_VAR_mail_username: ${{ secrets.MAIL_USERNAME }}
          TF_VAR_mail_password: ${{ secrets.MAIL_PASSWORD }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_polar_api_key: ${{ secrets.POLAR_API_KEY }}
          TF_VAR_polar_webhook_secret: ${{ secrets.POLAR_WEBHOOK_SECRET }}
          TF_VAR_polar_org_id: ${{ secrets.POLAR_ORG_ID }}
          TF_VAR_polar_product_board_monthly: ${{ secrets.POLAR_PRODUCT_BOARD_MONTHLY }}
          TF_VAR_polar_product_board_yearly: ${{ secrets.POLAR_PRODUCT_BOARD_YEARLY }}
          TF_VAR_polar_product_org_monthly: ${{ secrets.POLAR_PRODUCT_ORG_MONTHLY }}
          TF_VAR_polar_product_org_yearly: ${{ secrets.POLAR_PRODUCT_ORG_YEARLY }}
          TF_VAR_polar_product_credit_100: ${{ secrets.POLAR_PRODUCT_CREDIT_100 }}
          TF_VAR_polar_product_credit_500: ${{ secrets.POLAR_PRODUCT_CREDIT_500 }}
          TF_VAR_polar_product_credit_1000: ${{ secrets.POLAR_PRODUCT_CREDIT_1000 }}
          TF_VAR_discord_client_id: ${{ secrets.DISCORD_CLIENT_ID }}
          TF_VAR_discord_client_secret: ${{ secrets.DISCORD_CLIENT_SECRET }}
          TF_VAR_discord_bot_token: ${{ secrets.DISCORD_BOT_TOKEN }}
          TF_VAR_jira_oauth_client_id: ${{ secrets.JIRA_OAUTH_CLIENT_ID }}
          TF_VAR_jira_oauth_client_secret: ${{ secrets.JIRA_OAUTH_CLIENT_SECRET }}
          TF_VAR_github_app_id: ${{ secrets.GH_APP_ID }}
          TF_VAR_github_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          TF_VAR_github_app_slug: ${{ secrets.GH_APP_SLUG }}
          TF_VAR_confluence_oauth_client_id: ${{ secrets.CONFLUENCE_OAUTH_CLIENT_ID }}
          TF_VAR_confluence_oauth_client_secret: ${{ secrets.CONFLUENCE_OAUTH_CLIENT_SECRET }}
          TF_VAR_slack_client_id: ${{ secrets.SLACK_CLIENT_ID }}
          TF_VAR_slack_client_secret: ${{ secrets.SLACK_CLIENT_SECRET }}
          TF_VAR_slack_signing_secret: ${{ secrets.SLACK_SIGNING_SECRET }}
          TF_VAR_slack_token_encryption_key: ${{ secrets.SLACK_TOKEN_ENCRYPTION_KEY }}
          TF_VAR_slack_redirect_uri: ${{ secrets.SLACK_REDIRECT_URI }}
          TF_VAR_slack_user_redirect_uri: ${{ secrets.SLACK_USER_REDIRECT_URI }}

      - name: Output Terraform Values
        working-directory: infrastructure/terraform/environments/${{ github.event.inputs.environment || 'dev' }}
        run: terraform output
