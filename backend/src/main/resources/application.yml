spring:
  application:
    name: kanban-backend

  profiles:
    active: local

  # JPA
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: always

  # Jackson
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    time-zone: UTC

# Server
server:
  port: 8080

# JWT
jwt:
  secret: ${JWT_SECRET:your-super-secret-jwt-key-for-development-only-change-in-production}
  access-expiration: 3600000     # 1시간
  refresh-expiration: 604800000  # 7일

# Google OAuth2
google:
  oauth2:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}

# Email (Gmail SMTP)
spring.mail:
  host: smtp.gmail.com
  port: 587
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
          required: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

# Redis Cache
spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  timeout: 2000ms

# Cache
spring.cache:
  type: ${CACHE_TYPE:redis}
  redis:
    time-to-live: 600000  # 10분
    cache-null-values: false

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,hikaricp
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

# Multipart
spring.servlet.multipart:
  max-file-size: 110MB
  max-request-size: 220MB

# AI Provider ("claude" or "openai")
ai:
  provider: ${AI_PROVIDER:openai}
  claude:
    api-key: ${CLAUDE_API_KEY:}
    model:
      team: ${CLAUDE_MODEL_TEAM:claude-haiku-4-5-20251001}
      personal: ${CLAUDE_MODEL_PERSONAL:claude-haiku-4-5-20251001}
      standup: ${CLAUDE_MODEL_STANDUP:claude-haiku-4-5-20251001}
      meeting: ${CLAUDE_MODEL_MEETING:claude-haiku-4-5-20251001}
      diary: ${CLAUDE_MODEL_DIARY:claude-haiku-4-5-20251001}
  openai:
    api-key: ${OPENAI_API_KEY:}
    admin-key: ${OPENAI_ADMIN_KEY:}
    model:
      team: ${OPENAI_MODEL_TEAM:gpt-4o-mini}
      personal: ${OPENAI_MODEL_PERSONAL:gpt-4o-mini}
      standup: ${OPENAI_MODEL_STANDUP:gpt-4o-mini}
      meeting: ${OPENAI_MODEL_MEETING:gpt-4o-mini}
      diary: ${OPENAI_MODEL_DIARY:gpt-4o-mini}
  credit:
    reset-cron: "0 0 0 * * *"  # 매일 자정 UTC

# Custom Icon
app.customicon:
  vision-model: ${CUSTOMICON_VISION_MODEL:gpt-4o}
  image-model: ${CUSTOMICON_IMAGE_MODEL:dall-e-3}
  image-size: ${CUSTOMICON_IMAGE_SIZE:1024x1024}

# App Version (injected at build time)
app.version:
  commit: '@git.commit@'
  build-time: '@build.time@'

# Polar.sh (Merchant of Record)
polar:
  api-key: ${POLAR_API_KEY:}
  webhook-secret: ${POLAR_WEBHOOK_SECRET:}
  organization-id: ${POLAR_ORG_ID:}
  base-url: https://api.polar.sh
  products:
    board-monthly: ${POLAR_PRODUCT_BOARD_MONTHLY:}
    board-yearly: ${POLAR_PRODUCT_BOARD_YEARLY:}
    org-monthly: ${POLAR_PRODUCT_ORG_MONTHLY:}
    org-yearly: ${POLAR_PRODUCT_ORG_YEARLY:}
    credit-100: ${POLAR_PRODUCT_CREDIT_100:}
    credit-500: ${POLAR_PRODUCT_CREDIT_500:}
    credit-1000: ${POLAR_PRODUCT_CREDIT_1000:}

# Firebase (FCM Push Notifications)
firebase:
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}

# App config
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  testprod-frontend-url: ${TESTPROD_FRONTEND_URL:}
  websocket:
    broker-type: ${WS_BROKER_TYPE:simple}
  monitoring:
    enabled: true
    cloudwatch-enabled: ${CLOUDWATCH_ENABLED:false}
    ec2-instance-id: ${EC2_INSTANCE_ID:}
    rds-instance-id: ${RDS_INSTANCE_ID:}
    slack-webhook-url: ${MONITORING_SLACK_WEBHOOK_URL:}
    alert-check-interval: 300000  # 5분
    metric-flush-interval: 3600000  # 1시간
    data-retention-days: 7
    thresholds:
      cpu-percent: 80
      memory-percent: 85
      hikari-active-percent: 90
      error-rate-percent: 5
      slow-api-ms: 3000
  file:
    s3-enabled: ${S3_ENABLED:false}
    max-size: 5242880
    max-count: 5
    allowed-types: image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime
    s3-bucket: ${S3_BUCKET:bridge-kanban-attachments}
    cloudfront-domain: ${CLOUDFRONT_DOMAIN:}
    upload-dir: comments
    local-dir: ${FILE_LOCAL_DIR:./uploads}
    temp-expiry-minutes: 60
    thumbnail:
      max-width: 400
      max-height: 400
    video:
      max-size: 52428800
      ffmpeg-path: ${FFMPEG_PATH:/usr/bin/ffmpeg}
      ffprobe-path: ${FFPROBE_PATH:/usr/bin/ffprobe}

---
# Local Profile (H2)
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:kanban;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  # Local에서는 Simple 캐시 사용 (Redis 불필요)
  cache:
    type: simple

app:
  file:
    s3-enabled: false
    local-dir: ./uploads

---
# Dev Profile (PostgreSQL + Redis)
spring:
  config:
    activate:
      on-profile: dev

  sql:
    init:
      mode: never

  jpa:
    defer-datasource-initialization: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 86

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kanban_dev}
    username: ${DB_USERNAME:kanban}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

app:
  websocket:
    broker-type: redis
  file:
    s3-enabled: true
    s3-bucket: ${S3_BUCKET:bridge-kanban-attachments}
    cloudfront-domain: ${CLOUDFRONT_DOMAIN:}

---
# Prod Profile (PostgreSQL + Redis Pub/Sub)
spring:
  config:
    activate:
      on-profile: prod

  sql:
    init:
      mode: never

  jpa:
    defer-datasource-initialization: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 86

  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

app:
  websocket:
    broker-type: redis
  file:
    s3-enabled: true
    s3-bucket: ${S3_BUCKET}
    cloudfront-domain: ${CLOUDFRONT_DOMAIN:}
