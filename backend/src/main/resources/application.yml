spring:
  application:
    name: kanban-backend

  profiles:
    active: local

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  # Jackson
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

# Server
server:
  port: 8080

# JWT
jwt:
  secret: ${JWT_SECRET:your-super-secret-jwt-key-for-development-only-change-in-production}
  access-expiration: 3600000     # 1시간
  refresh-expiration: 604800000  # 7일

# Google OAuth2
google:
  oauth2:
    client-id: ${GOOGLE_CLIENT_ID:573353962587-1r0l8otb51n8h0iuha5ek0e2sfqjft1j.apps.googleusercontent.com}

# Email (Gmail SMTP)
spring.mail:
  host: smtp.gmail.com
  port: 587
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
          required: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

# Redis Cache
spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  timeout: 2000ms

# Cache
spring.cache:
  type: ${CACHE_TYPE:redis}
  redis:
    time-to-live: 600000  # 10분
    cache-null-values: false

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# App config
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

---
# Local Profile (H2)
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:kanban;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  # Local에서는 Simple 캐시 사용 (Redis 불필요)
  cache:
    type: simple

---
# Dev Profile (PostgreSQL, No Redis)
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kanban_dev}
    username: ${DB_USERNAME:kanban}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  cache:
    type: simple

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

management:
  health:
    redis:
      enabled: false

---
# Prod Profile (PostgreSQL)
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
