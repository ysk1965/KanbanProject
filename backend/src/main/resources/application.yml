spring:
  application:
    name: kanban-backend

  profiles:
    active: local

  # JPA
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: always

  # Jackson
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    time-zone: UTC

# Server
server:
  port: 8080

# JWT
jwt:
  secret: ${JWT_SECRET:your-super-secret-jwt-key-for-development-only-change-in-production}
  access-expiration: 86400000     # 24시간
  refresh-expiration: 2592000000  # 30일

# Google OAuth2
google:
  oauth2:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}

# Email (Gmail SMTP)
spring.mail:
  host: smtp.gmail.com
  port: 587
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
          required: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

# Redis Cache
spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  timeout: 2000ms

# Cache
spring.cache:
  type: ${CACHE_TYPE:simple}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,hikaricp
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

# Multipart
spring.servlet.multipart:
  max-file-size: 110MB
  max-request-size: 220MB
  file-size-threshold: 1MB
  location: ${MULTIPART_LOCATION:/var/tmp/spring-multipart}

# AI Provider ("claude" or "openai")
ai:
  provider: ${AI_PROVIDER:openai}
  claude:
    api-key: ${CLAUDE_API_KEY:}
    model:
      team: ${CLAUDE_MODEL_TEAM:claude-haiku-4-5-20251001}
      personal: ${CLAUDE_MODEL_PERSONAL:claude-haiku-4-5-20251001}
      standup: ${CLAUDE_MODEL_STANDUP:claude-haiku-4-5-20251001}
      meeting: ${CLAUDE_MODEL_MEETING:claude-haiku-4-5-20251001}
      diary: ${CLAUDE_MODEL_DIARY:claude-haiku-4-5-20251001}
      # MILKYWAY 커밋 플랜 — ai.provider 값과 무관하게 항상 Claude로 호출된다.
      # 비용을 줄이려면 CLAUDE_MODEL_COMMIT_PLAN=claude-haiku-4-5 로 교체.
      commit-plan: ${CLAUDE_MODEL_COMMIT_PLAN:claude-opus-4-8}
  openai:
    api-key: ${OPENAI_API_KEY:}
    admin-key: ${OPENAI_ADMIN_KEY:}
    model:
      team: ${OPENAI_MODEL_TEAM:gpt-4o-mini}
      personal: ${OPENAI_MODEL_PERSONAL:gpt-4o-mini}
      standup: ${OPENAI_MODEL_STANDUP:gpt-4o-mini}
      meeting: ${OPENAI_MODEL_MEETING:gpt-4o-mini}
      diary: ${OPENAI_MODEL_DIARY:gpt-4o-mini}
  credit:
    reset-cron: "0 0 0 * * *"  # 매일 자정 UTC

# Custom Icon
app.customicon:
  vision-model: ${CUSTOMICON_VISION_MODEL:gpt-4o}
  image-model: ${CUSTOMICON_IMAGE_MODEL:dall-e-3}
  image-size: ${CUSTOMICON_IMAGE_SIZE:1024x1024}

# App Version (injected at build time)
app.version:
  commit: '@git.commit@'
  build-time: '@build.time@'

# Polar.sh (Merchant of Record)
polar:
  api-key: ${POLAR_API_KEY:}
  webhook-secret: ${POLAR_WEBHOOK_SECRET:}
  organization-id: ${POLAR_ORG_ID:}
  base-url: https://api.polar.sh
  products:
    board-monthly: ${POLAR_PRODUCT_BOARD_MONTHLY:}
    board-yearly: ${POLAR_PRODUCT_BOARD_YEARLY:}
    org-monthly: ${POLAR_PRODUCT_ORG_MONTHLY:}
    org-yearly: ${POLAR_PRODUCT_ORG_YEARLY:}
    credit-100: ${POLAR_PRODUCT_CREDIT_100:}
    credit-500: ${POLAR_PRODUCT_CREDIT_500:}
    credit-1000: ${POLAR_PRODUCT_CREDIT_1000:}

# Discord Bot (OAuth2)
discord:
  client-id: ${DISCORD_CLIENT_ID:}
  client-secret: ${DISCORD_CLIENT_SECRET:}
  bot-token: ${DISCORD_BOT_TOKEN:}
  redirect-uri: ${DISCORD_REDIRECT_URI:http://localhost:8080/api/v1/discord/oauth/callback}
  bot-permissions: 2048  # Send Messages

# Slack App (OAuth2)
slack:
  app:
    client-id: ${SLACK_CLIENT_ID:}
    client-secret: ${SLACK_CLIENT_SECRET:}
    signing-secret: ${SLACK_SIGNING_SECRET:}
    token-encryption-key: ${SLACK_TOKEN_ENCRYPTION_KEY:}
    bot-scopes: "chat:write,channels:read,groups:read,channels:history,groups:history,files:read,commands,reactions:read,im:write"
    user-scopes: "identity.basic,identity.email"
    redirect-uri: ${SLACK_REDIRECT_URI:http://localhost:8080/api/v1/slack/oauth/callback}
    user-redirect-uri: ${SLACK_USER_REDIRECT_URI:http://localhost:8080/api/v1/slack/oauth/user-callback}

# JIRA OAuth 2.0 (3LO) — developer.atlassian.com에 등록한 앱
jira:
  oauth:
    client-id: ${JIRA_OAUTH_CLIENT_ID:}
    client-secret: ${JIRA_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${JIRA_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/jira/oauth/callback}

# Confluence Cloud OAuth 2.0 (3LO) — 주간보고 수집
# JIRA와 같은 Atlassian 앱을 써도 되지만, 보는 사이트가 다를 수 있어 설정을 분리해 둔다.
confluence:
  oauth:
    client-id: ${CONFLUENCE_OAUTH_CLIENT_ID:}
    client-secret: ${CONFLUENCE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${CONFLUENCE_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/confluence/oauth/callback}

# GitHub App (자동 보고서 커밋 수집)
# github.com/settings/apps 에서 등록. 권한은 Contents: Read + Metadata: Read 만 있으면 된다.
# private-key는 PKCS#1(BEGIN RSA PRIVATE KEY) 그대로 넣어도 되고, 줄바꿈은 \n 이스케이프를 허용한다.
github:
  app:
    app-id: ${GITHUB_APP_ID:}
    # 로컬 개발용 인라인 키. 운영에서는 비워 두고 private-key-ssm-name을 쓴다
    # (EB 환경변수는 전체 4KB 한도라 PEM을 직접 넣지 못한다).
    private-key: ${GITHUB_APP_PRIVATE_KEY:}
    private-key-ssm-name: ${GITHUB_APP_PRIVATE_KEY_SSM_NAME:}
    slug: ${GITHUB_APP_SLUG:}
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    commit-detail-limit: ${GITHUB_COMMIT_DETAIL_LIMIT:50}
    max-commits-per-repo: ${GITHUB_MAX_COMMITS_PER_REPO:300}

# Firebase (FCM Push Notifications)
firebase:
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}

# App config
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  testprod-frontend-url: ${TESTPROD_FRONTEND_URL:}
  # system_config 에 저장하는 민감 설정값(AI API 키 등)의 AES-GCM 마스터 키.
  # base64 32바이트 권장. 미설정 시 관리자 대시보드에서의 키 저장이 비활성화된다.
  config-encryption-key: ${CONFIG_ENCRYPTION_KEY:}
  websocket:
    broker-type: ${WS_BROKER_TYPE:simple}
  monitoring:
    enabled: true
    cloudwatch-enabled: ${CLOUDWATCH_ENABLED:false}
    ec2-instance-id: ${EC2_INSTANCE_ID:}
    rds-instance-id: ${RDS_INSTANCE_ID:}
    slack-webhook-url: ${MONITORING_SLACK_WEBHOOK_URL:}
    alert-check-interval: 300000  # 5분
    metric-flush-interval: 3600000  # 1시간
    data-retention-days: 7
    thresholds:
      cpu-percent: 80
      memory-percent: 85
      hikari-active-percent: 90
      error-rate-percent: 5
      slow-api-ms: 3000
  file:
    s3-enabled: ${S3_ENABLED:false}
    max-size: 31457280
    max-count: 5
    allowed-types: image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,text/plain,text/markdown
    s3-bucket: ${S3_BUCKET:bridge-kanban-attachments}
    cloudfront-domain: ${CLOUDFRONT_DOMAIN:}
    upload-dir: comments
    local-dir: ${FILE_LOCAL_DIR:./uploads}
    temp-expiry-minutes: 60
    thumbnail:
      max-width: 400
      max-height: 400
    video:
      max-size: 52428800
      ffmpeg-path: ${FFMPEG_PATH:/usr/bin/ffmpeg}
      ffprobe-path: ${FFPROBE_PATH:/usr/bin/ffprobe}
  storage:
    # presigned 대용량 업로드 상한 (기본 2GB). direct(multipart) 경로는 app.file 제한을 따른다.
    max-file-size: ${STORAGE_MAX_FILE_SIZE:2147483648}
    quota:
      # 사용자 구독 티어별 스토리지 용량 한도 (바이트)
      base-bytes: ${STORAGE_QUOTA_BASE:1073741824}       # 1GB (체험)
      standard-bytes: ${STORAGE_QUOTA_STANDARD:5368709120}  # 5GB
      premium-bytes: ${STORAGE_QUOTA_PREMIUM:21474836480}   # 20GB

---
# Local Profile (H2)
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:kanban;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        # 로컬 전용: 트랜잭션당 쿼리 수/세션 통계 로깅 (성능 측정용)
        generate_statistics: true

  flyway:
    enabled: false

  # Local에서는 Simple 캐시 사용 (Redis 불필요)
  cache:
    type: simple

app:
  file:
    s3-enabled: false
    local-dir: ./uploads

logging:
  level:
    org.hibernate.stat: DEBUG

---
# Dev Profile (PostgreSQL + Redis)
spring:
  config:
    activate:
      on-profile: dev

  sql:
    init:
      mode: never

  jpa:
    defer-datasource-initialization: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 86
    out-of-order: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kanban_dev}
    username: ${DB_USERNAME:kanban}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

app:
  websocket:
    broker-type: simple
  file:
    s3-enabled: true
    s3-bucket: ${S3_BUCKET:bridge-kanban-attachments}
    cloudfront-domain: ${CLOUDFRONT_DOMAIN:}

---
# Prod Profile (PostgreSQL + Simple Cache)
spring:
  config:
    activate:
      on-profile: prod

  sql:
    init:
      mode: never

  jpa:
    defer-datasource-initialization: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 86
    out-of-order: true

  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

app:
  websocket:
    broker-type: simple
  file:
    s3-enabled: true
    s3-bucket: ${S3_BUCKET}
    cloudfront-domain: ${CLOUDFRONT_DOMAIN:}
