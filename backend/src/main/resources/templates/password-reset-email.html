<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background-color: #0A0E17;">
    <table role="presentation" style="width: 100%; border-collapse: collapse;">
        <tr>
            <td align="center" style="padding: 40px 0;">
                <table role="presentation" style="width: 100%; max-width: 600px; border-collapse: collapse;">
                    <!-- Header -->
                    <tr>
                        <td style="padding: 30px; background-color: #0F1419; border-radius: 12px 12px 0 0;">
                            <h1 style="margin: 0; color: #ffffff; font-size: 24px; font-weight: bold;">
                                BRIDGE SPOTS
                            </h1>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td style="padding: 40px 30px; background-color: #0F1419;">
                            <!-- Icon -->
                            <div style="text-align: center; margin-bottom: 30px;">
                                <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #6366F1, #2DD4BF); border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center;">
                                    <span style="font-size: 36px; color: white;">&#x1F512;</span>
                                </div>
                            </div>

                            <!-- Message -->
                            <h2 style="margin: 0 0 20px 0; color: #ffffff; font-size: 20px; text-align: center;">
                                비밀번호 재설정 요청
                            </h2>

                            <p style="margin: 0 0 30px 0; color: #94A3B8; font-size: 16px; line-height: 1.6; text-align: center;">
                                안녕하세요, <strong th:text="${userName}" style="color: #ffffff;">사용자</strong>님!<br>
                                비밀번호 재설정을 요청하셨습니다.<br>
                                아래 버튼을 클릭하여 새 비밀번호를 설정해주세요.
                            </p>

                            <!-- CTA Button -->
                            <div style="text-align: center; margin-bottom: 30px;">
                                <a th:href="${resetLink}"
                                   style="display: inline-block; padding: 16px 48px; background: linear-gradient(135deg, #6366F1, #4F46E5); color: #ffffff; text-decoration: none; border-radius: 12px; font-size: 16px; font-weight: bold;">
                                    비밀번호 재설정
                                </a>
                            </div>

                            <!-- Info Box -->
                            <div style="background-color: #1E293B; border-radius: 8px; padding: 20px; margin-bottom: 20px; border-left: 4px solid #6366F1;">
                                <p style="margin: 0; color: #94A3B8; font-size: 14px; line-height: 1.6;">
                                    <strong style="color: #ffffff;">&#x23F0; 유효 시간:</strong> 이 링크는 1시간 후 만료됩니다.<br>
                                    <strong style="color: #ffffff;">&#x1F512; 보안:</strong> 본인이 요청하지 않았다면 이 메일을 무시해주세요.
                                </p>
                            </div>

                            <p style="margin: 20px 0 0 0; color: #64748B; font-size: 14px; text-align: center;">
                                버튼이 작동하지 않으면 아래 링크를 복사해서 브라우저에 붙여넣으세요:
                            </p>
                            <p style="margin: 10px 0 0 0; color: #6366F1; font-size: 12px; text-align: center; word-break: break-all;">
                                <a th:href="${resetLink}" th:text="${resetLink}" style="color: #6366F1;">링크</a>
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 30px; background-color: #0A0E17; border-radius: 0 0 12px 12px; text-align: center;">
                            <p style="margin: 0 0 10px 0; color: #64748B; font-size: 14px;">
                                BRIDGE SPOTS - Connect Every Working Spot
                            </p>
                            <p style="margin: 0; color: #475569; font-size: 12px;">
                                이 이메일은 비밀번호 재설정 요청에 따라 자동 발송되었습니다.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
