plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'com.diffplug.spotless' version '8.10.4'
}

group = 'com.kanban'
version = '0.0.2-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Dotenv
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Rate Limiting
    implementation 'com.bucket4j:bucket4j-core:8.10.1'

    // Redis Cache
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // AWS S3
    implementation 'software.amazon.awssdk:s3:2.57.3'

    // AWS CloudWatch
    implementation 'software.amazon.awssdk:cloudwatch:2.57.3'

    // AWS SSM Parameter Store (GitHub App 개인키 등 EB 환경변수 4KB 한도를 넘는 비밀값 보관)
    implementation 'software.amazon.awssdk:ssm:2.57.3'

    // Image Thumbnail
    implementation 'net.coobird:thumbnailator:0.4.21'

    // FFmpeg (Video Thumbnail)
    implementation 'net.bramp.ffmpeg:ffmpeg:0.9.2'

    // Google OAuth2
    implementation 'com.google.api-client:google-api-client:2.9.2'

    // Firebase Admin (FCM Push Notifications)
    implementation 'com.google.firebase:firebase-admin:9.11.0'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // Flyway (Schema Migration)
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Spring Retry (NoteVersion 채번 race 등 DB unique 충돌 재시도용)
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'

    // ShedLock (스케줄러 분산 락 — 무중단 배포 겹침 구간/오토스케일 시 중복 실행 방지)
    implementation 'net.javacrumbs.shedlock:shedlock-spring:7.10.1'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.10.1'

    // Observability — 운영 JSON 로그(logstash encoder) + Sentry 에러 리포팅 (DSN 비우면 no-op)
    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'
    implementation 'io.sentry:sentry-spring-boot-starter-jakarta:8.61.1'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // DevTools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // 로컬(Asia/Seoul 등 비-UTC) 머신에서 H2/JDBC가 OS 타임존을 캐시해 LocalDate가 하루 밀리는 문제 방지.
    // @PostConstruct 의 TimeZone.setDefault(UTC) 는 JDBC 초기화보다 늦어서 이 시점엔 이미 늦다.
    systemProperty 'user.timezone', 'UTC'
    finalizedBy 'jacocoTestReport'
}

// 커버리지 리포트(XML + HTML). 아직 임계치 게이트는 없다 — 리포트만 생성한다.
jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn 'test'
    reports {
        xml.required = true
        html.required = true
    }
}

// 포맷 체크는 develop 대비 변경된 파일에만 적용(ratchet) — 코드베이스 일괄 리포맷을 피한다.
spotless {
    ratchetFrom 'origin/develop'
    java {
        target 'src/**/*.java'
        palantirJavaFormat('2.102.0')
        removeUnusedImports()
    }
}

// 로컬 개발 실행(./gradlew bootRun)을 UTC 로 기동한다.
// 배포는 java -jar (bootJar) 라 이 설정의 영향을 받지 않는다(운영 서버는 이미 UTC).
tasks.named('bootRun') {
    jvmArgs('-Duser.timezone=UTC')
}

processResources {
    filesMatching('application.yml') {
        def gitCommit = 'git rev-parse --short HEAD'.execute().text.trim() ?: 'unknown'
        def buildTime = java.time.Instant.now().toString()
        filter { line ->
            line.replace('@git.commit@', gitCommit)
                .replace('@build.time@', buildTime)
        }
    }
}
